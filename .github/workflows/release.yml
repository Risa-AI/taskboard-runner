name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/taskboard-runner_${GITHUB_REF_NAME}_linux_${arch}" ./cmd/taskboard-runner
          done
          cd dist && sha256sum taskboard-runner_* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/risa-ai/taskboard-runner:${{ github.ref_name }}
            ghcr.io/risa-ai/taskboard-runner:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Risa-AI/taskboard-runner
